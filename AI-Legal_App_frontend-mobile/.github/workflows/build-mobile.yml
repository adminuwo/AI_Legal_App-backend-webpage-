name: Build Mobile App (GitHub Runner Native)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform (android, ios, all)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      android_build_type:
        description: 'Android Format (apk, aab, both)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
      environment:
        description: 'Environment Config (development, preview, production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build Android (${{ inputs.environment }} - ${{ inputs.android_build_type }})
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Generate Native Android Code (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        if: ${{ inputs.android_build_type == 'apk' || inputs.android_build_type == 'both' }}
        run: |
          cd android
          if [ "${{ inputs.environment }}" = "development" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: 🔨 Build Android AAB
        if: ${{ inputs.android_build_type == 'aab' || inputs.android_build_type == 'both' }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: 📤 Upload Android APK Artifact
        if: ${{ inputs.android_build_type == 'apk' || inputs.android_build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.environment }}-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: 📤 Upload Android AAB Artifact
        if: ${{ inputs.android_build_type == 'aab' || inputs.android_build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.environment }}-aab
          path: android/app/build/outputs/bundle/**/*.aab

  build-ios:
    name: Build iOS (${{ inputs.environment }})
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-latest
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🍎 Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Generate Native iOS Code (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🍫 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔨 Archive iOS Build
        run: |
          cd ios
          SCHEME_NAME=$(ls -d *.xcworkspace | sed 's/\.xcworkspace//')
          xcodebuild -workspace "${SCHEME_NAME}.xcworkspace" \
                     -scheme "${SCHEME_NAME}" \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/App.xcarchive archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: 📦 Package .IPA File
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r AI-Legal-App-${{ inputs.environment }}.ipa Payload

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.environment }}-ipa
          path: ios/AI-Legal-App-${{ inputs.environment }}.ipa
